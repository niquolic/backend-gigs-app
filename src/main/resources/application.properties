# Aucun identifiant en dur ici : tout vient de variables d'environnement.
# Local : export MONGODB_URI=... et JWT_SECRET=... avant de lancer.
# Cloud Run : Variables & Secrets du service (idéalement via Secret Manager).
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=GigsAppDB

jwt.secret=${JWT_SECRET}
# 30 jours en millisecondes.
jwt.expirationMs=2592000000
